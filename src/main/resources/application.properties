spring.application.name=lettuce-latency-repro
spring.main.web-application-type=none

# Same dependencies as the production service (Spring Boot 4.0.6, Lettuce 6.8.2, Actuator, Brave tracing).
# Spring Boot 4 has no Lettuce metrics auto-configuration, so ClientResources keeps Lettuce's own
# DefaultCommandLatencyCollector (HdrHistogram and LatencyUtils arrive transitively through Micrometer).
# Only the infrastructure this repro does not need is switched off, so the app starts with just Redis.
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
  io.awspring.cloud.autoconfigure.sqs.SqsAutoConfiguration,\
  io.awspring.cloud.autoconfigure.config.parameterstore.ParameterStoreAutoConfiguration
spring.cloud.aws.region.static=us-east-1

spring.data.redis.host=localhost
spring.data.redis.port=6379

# anonymous = new ProtocolKeyword per call without toString() (the bug), stable = enum keyword (the fix)
repro.keyword=anonymous
# commands per second
repro.rate=500
# stop sending commands above this heap usage (0 = never; record-jfr.sh uses 0.9)
repro.stop-at-heap-ratio=0
